description: 'Roadsurfer is a Munich-based camper van, motorhome, and RV travel company founded in 2016,
  operating a fleet of 10,000+ vehicles across 100+ pick-up/drop-off locations in 16 countries in Europe and
  North America. Beyond flexible RV rentals it offers RV subscriptions, RV sales, one-way "Rallies," and
  roadsurfer Spots, a network of 10,000+ hand-picked European campsites. Roadsurfer is a consumer-facing
  brand with no public developer API; this profile captures its identity, web properties, and published
  llms.txt for the API Evangelist network. Backed by HV Capital.'
